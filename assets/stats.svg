<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="900" height="110" role="img" aria-label="4,000+ students used the UGAC website. 1,000+ monthly active users on Creddit. 200+ students used the TA Portal. 6 campus platforms shipped.">
  <defs>
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1F5FD6"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; text-anchor: middle; }
      .num { fill: url(#num); font-size: 34px; font-weight: 800; }
      /* Mid grey: readable on both GitHub's light and dark backgrounds. */
      .lbl { fill: #8B949E; font-size: 13px; }
    </style>
  </defs>

  <!-- No background, so it sits on the page in either theme. Thin dividers
       separate the four stats; each number rises in, left to right. -->
  <g stroke="#8B949E" stroke-opacity="0.35">
    <line x1="225" y1="18" x2="225" y2="92"/>
    <line x1="450" y1="18" x2="450" y2="92"/>
    <line x1="675" y1="18" x2="675" y2="92"/>
  </g>

  <g>
    <g opacity="0" transform="translate(0 10)">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" dur="0.5s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      <text class="num" x="112" y="50">4,000+</text>
    </g>
    <text class="lbl" x="112" y="75">students used the</text>
    <text class="lbl" x="112" y="91">UGAC website</text>
  </g>

  <g>
    <g opacity="0" transform="translate(0 10)">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" dur="0.5s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      <text class="num" x="337" y="50">1,000+</text>
    </g>
    <text class="lbl" x="337" y="75">monthly active users</text>
    <text class="lbl" x="337" y="91">on Creddit</text>
  </g>

  <g>
    <g opacity="0" transform="translate(0 10)">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" dur="0.5s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      <text class="num" x="562" y="50">200+</text>
    </g>
    <text class="lbl" x="562" y="75">students used the</text>
    <text class="lbl" x="562" y="91">TA Portal</text>
  </g>

  <g>
    <g opacity="0" transform="translate(0 10)">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.8s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" dur="0.5s" begin="0.8s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      <text class="num" x="787" y="50">6</text>
    </g>
    <text class="lbl" x="787" y="75">campus platforms</text>
    <text class="lbl" x="787" y="91">shipped</text>
  </g>
</svg>
