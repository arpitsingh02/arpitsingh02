<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 46" width="230" height="46" role="img" aria-label="Connect on LinkedIn">
  <!-- Outline only, no fill, so it sits on the page in either theme. -->
  <rect x="1" y="1" width="228" height="44" rx="22" fill="none" stroke="#3B82F6" stroke-width="1.5"/>

  <!-- LinkedIn mark -->
  <rect x="14" y="11" width="24" height="24" rx="5" fill="#0A66C2"/>
  <circle cx="20.2" cy="17.2" r="2.1" fill="#FFFFFF"/>
  <rect x="18.3" y="20.6" width="3.8" height="9.6" rx="0.7" fill="#FFFFFF"/>
  <path d="M24.3 20.6 h3.6 v1.4 c0.7 -1 1.8 -1.65 3.3 -1.65 c2.5 0 3.6 1.65 3.6 4.4 V30.2 h-3.8 v-4.9 c0 -1.3 -0.45 -2.1 -1.55 -2.1 c-1.2 0 -1.75 0.9 -1.75 2.25 V30.2 H24.3 Z" fill="#FFFFFF"/>

  <text x="48" y="28.5" style="text-anchor:start" fill="#3B82F6" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Connect on LinkedIn</text>

  <!-- Arrow that nudges forward now and then. -->
  <path d="M199 23 h11 M205.5 18.5 l4.5 4.5 l-4.5 4.5" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
