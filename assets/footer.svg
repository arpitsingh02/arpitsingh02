<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 100" width="900" height="100" role="presentation">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#023E8A"/>
      <stop offset="1" stop-color="#001233"/>
    </linearGradient>
  </defs>

  <!-- Mirror of the header waves, rising from the bottom edge. -->
  <path fill="#0A4DB0" fill-opacity="0.55"
        d="M0 32 Q 112.5 60 225 32 T 450 32 T 675 32 T 900 32 T 1125 32 T 1350 32 T 1575 32 T 1800 32 V 100 H 0 Z">
    <animateTransform attributeName="transform" type="translate" from="-450 0" to="0 0" dur="11s" repeatCount="indefinite"/>
  </path>
  <path fill="url(#navy)"
        d="M0 48 Q 112.5 76 225 48 T 450 48 T 675 48 T 900 48 T 1125 48 T 1350 48 T 1575 48 T 1800 48 V 100 H 0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="8s" repeatCount="indefinite"/>
  </path>
</svg>
