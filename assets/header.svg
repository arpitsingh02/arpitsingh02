<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="Arpit Singh. Product, Strategy, Technology">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#001233"/>
      <stop offset="1" stop-color="#023E8A"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <!-- Each wave is two periods wide (450px per period) and slides left by
       exactly one period, so the loop is seamless. -->
  <path fill="#0A4DB0" fill-opacity="0.55"
        d="M0 168 Q 112.5 140 225 168 T 450 168 T 675 168 T 900 168 T 1125 168 T 1350 168 T 1575 168 T 1800 168 V 0 H 0 Z">
    <animateTransform attributeName="transform" type="translate" from="-450 0" to="0 0" dur="11s" repeatCount="indefinite"/>
  </path>
  <path fill="url(#navy)"
        d="M0 152 Q 112.5 124 225 152 T 450 152 T 675 152 T 900 152 T 1125 152 T 1350 152 T 1575 152 T 1800 152 V 0 H 0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="8s" repeatCount="indefinite"/>
  </path>

  <text x="450" y="84" fill="#FFFFFF" font-size="50" font-weight="700">Arpit Singh</text>
  <text x="450" y="118" fill="#C9DAF8" font-size="18" letter-spacing="1">Product · Strategy · Technology</text>
</svg>
