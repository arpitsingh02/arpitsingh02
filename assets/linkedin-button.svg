<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 52" width="250" height="52" role="img" aria-label="Connect on LinkedIn">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001845"/>
      <stop offset="1" stop-color="#0A3D91"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pill"><rect x="1" y="1" width="248" height="50" rx="25"/></clipPath>
  </defs>

  <rect x="1" y="1" width="248" height="50" rx="25" fill="url(#fill)" stroke="#2F6BFF" stroke-width="1.5"/>

  <!-- A soft band of light sweeps across every few seconds. -->
  <g clip-path="url(#pill)">
    <rect x="-80" y="-10" width="60" height="72" fill="url(#sheen)" transform="skewX(-20)">
      <animate attributeName="x" values="-80;320;320" keyTimes="0;0.35;1" dur="4s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- LinkedIn mark -->
  <rect x="14" y="12" width="28" height="28" rx="6" fill="#0A66C2"/>
  <circle cx="21.2" cy="19" r="2.4" fill="#FFFFFF"/>
  <rect x="19" y="23" width="4.4" height="11" rx="0.8" fill="#FFFFFF"/>
  <path d="M26 23 h4.2 v1.6 c0.8 -1.2 2.1 -1.9 3.8 -1.9 c2.9 0 4.2 1.9 4.2 5.1 V34 h-4.4 v-5.6 c0 -1.5 -0.5 -2.4 -1.8 -2.4 c-1.4 0 -2 1 -2 2.6 V34 H26 Z" fill="#FFFFFF"/>

  <text x="54" y="31.5" fill="#FFFFFF" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Connect on LinkedIn</text>

  <!-- Arrow that nudges forward now and then. -->
  <path d="M220 26 h12 M227 21 l5 5 l-5 5" stroke="#8DBBFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;4 0;0 0" keyTimes="0;0.7;0.85;1" dur="2.4s" repeatCount="indefinite"/>
  </path>
</svg>
